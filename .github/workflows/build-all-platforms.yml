name: Multi-Platform Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. WINDOWS DESKTOP INSTALLER (.exe & .zip)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Package Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish never

      - name: Rename and Stage Windows Artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          cp release/*-Windows-*.exe dist-windows/ 2>/dev/null || true
          cp release/*-Windows-*.zip dist-windows/ 2>/dev/null || true
          ls -la dist-windows/

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: dist-windows/
          retention-days: 30

  # -------------------------------------------------------------
  # 2. MACOS DESKTOP INSTALLER (.dmg & .zip for Apple Silicon & Intel)
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Package macOS Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac -- --publish never

      - name: Stage macOS Artifacts
        shell: bash
        run: |
          mkdir -p dist-macos
          cp release/*-macOS-*.dmg dist-macos/ 2>/dev/null || true
          cp release/*-macOS-*.zip dist-macos/ 2>/dev/null || true
          ls -la dist-macos/

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: dist-macos/
          retention-days: 30

  # -------------------------------------------------------------
  # 3. ANDROID NATIVE APP INSTALLER (.apk)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Native App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android Build Tools 35 & Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android Native APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage Android APK
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/Plantar-Pressure-Analysis-System-1.0.0.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/plantar-pressure.apk
          ls -lh dist-android/

      - name: Upload Android APK Installer
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist-android/
          retention-days: 30

  # -------------------------------------------------------------
  # 4. IOS APP INSTALLER (.ipa & Simulator Bundle)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App (.ipa & Simulator Bundle)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Build Generic iOS Device App (.app & .ipa)
        run: |
          mkdir -p dist-ios
          # Build Release configuration without requiring code signing cert
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          # Package into standard sideloadable iOS .ipa
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r dist-ios/Plantar-Pressure-Analysis-System-iOS.ipa Payload
          rm -rf Payload

      - name: Build iOS Simulator Bundle (Direct Test on Mac Xcode Simulator)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath ios/sim_build \
            CODE_SIGNING_ALLOWED=NO \
            build

          cd ios/sim_build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/dist-ios/Plantar-Pressure-Analysis-System-iOS-Simulator.app.zip" App.app

      - name: Verify iOS Artifacts
        run: |
          ls -lh dist-ios/

      - name: Upload iOS Installers
        uses: actions/upload-artifact@v7
        with:
          name: ios-installers
          path: dist-ios/
          retention-days: 30

  # -------------------------------------------------------------
  # 5. ALL-PLATFORM UNIFIED RELEASE & DISTRIBUTION
  # -------------------------------------------------------------
  package-and-publish:
    name: Package All Installers & Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-android, build-ios]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Unified Artifact Directory
        run: mkdir -p release-bundle

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: release-bundle/windows/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-installers
          path: release-bundle/macos/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-bundle/android/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-installers
          path: release-bundle/ios/

      - name: Flatten and List All Generated Client Installers
        run: |
          mkdir -p unified-installers
          find release-bundle -type f -exec cp {} unified-installers/ \;
          echo "=== Complete Multi-Platform Installer Suite ==="
          ls -lh unified-installers/

      - name: Upload Unified Installer Suite
        uses: actions/upload-artifact@v7
        with:
          name: Plantar-Pressure-All-Platform-Installers
          path: unified-installers/
          retention-days: 90

      - name: Publish to GitHub Releases (Tags or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          name: "Plantar Pressure Analysis System ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: unified-installers/*
          body: |
            ## Plantar Pressure Analysis System — Multi-Platform Release
            Automated production build for clinical evaluation.

            ### 📦 Included Installers:
            - **Android App**: `Plantar-Pressure-Analysis-System-1.0.0.apk` (Install directly on phone/tablet)
            - **Windows Installer**: Setup `.exe` & portable `.zip` (Windows 10/11 64-bit)
            - **macOS Installer**: `.dmg` & `.zip` (Apple Silicon & Intel)
            - **iOS App**: `.ipa` (for AltStore/Sideloadly) & `.app.zip` (Xcode Simulator)

            ### ✨ Key Clinical Features:
            - Harris Mat Optical Scan to Jet Transparent Heatmap conversion
            - Automated 10-Zone Anatomical Foot Partitioning
            - Relative Intensity Index (RII) [0.00 – 1.00] calculation
            - Multi-frame burst camera capture with Laplacian sharpness scoring
            - 4-Page Clinical Orthotic PDF Report generation
            - 100% on-device offline processing
